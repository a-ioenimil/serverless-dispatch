name: "Serverless Dispatch Pipeline"

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    id-token: write # Required for requesting the JWT
    contents: read # Required for actions/checkout

env:
    AWS_REGION: "eu-west-1"
    TF_VERSION: "latest"
    GO_VERSION: "1.21"
    # This needs to be replaced with the output from 'terraform apply'
    AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    TF_VAR_file: "dev.tfvars"

jobs:
    integration:
        name: "Integration Checks"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: functions

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: functions/go.sum

            - name: Go Format Check
              run: if [ "$(gofmt -l .)" = "" ]; then echo "Go code is formatted"; else echo "Go code is not formatted"; exit 1; fi

            - name: Go Test
              run: go test -v ./...

    infra-plan:
        name: "Infrastructure Plan"
        needs: integration
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform/infra

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Create Terraform Configs
              run: |
                  # Create Backend Config
                  cat <<EOF > dev.tfbackend
                  bucket = "${{ secrets.TF_STATE_BUCKET }}"
                  key    = "lab/foundation.tfstate"
                  region = "eu-west-1"
                  EOF

                  # Create Vars File
                  echo "${{ secrets.TF_DEV_TFVARS }}" > dev.tfvars

            - name: Terraform Init
              run: terraform init -backend-config=dev.tfbackend

            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -var-file=${{ env.TF_VAR_file }} -out=tfplan

    infra-deploy:
        name: "Infrastructure Deploy"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        needs: infra-plan
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform/infra

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Go (For Lambda Builds)
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Create Terraform Configs
              run: |
                  # Create Backend Config
                  cat <<EOF > dev.tfbackend
                  bucket = "${{ secrets.TF_STATE_BUCKET }}"
                  key    = "lab/foundation.tfstate"
                  region = "eu-west-1"
                  EOF

                  # Create Vars File
                  echo "${{ secrets.TF_DEV_TFVARS }}" > dev.tfvars

            - name: Terraform Init
              run: terraform init -backend-config=dev.tfbackend

            - name: Build and Push Artifacts to S3
              if: github.event_name == 'push'
              env:
                  APP_VERSION: ${{ github.sha }}
              run: |
                  echo "Building versions for commit $APP_VERSION"
                  BUCKET_ID=$(terraform output -raw artifact_bucket_id_output) # We need to expose this output in root

                  # We need to build manually here because we are disabling Terraform's build
                  cd ../../functions/cmd
                  for dir in */; do
                    pkg=${dir%/}
                    echo "Building $pkg..."
                    cd $pkg
                    GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap main.go
                    zip -j ${pkg}.zip bootstrap
                    aws s3 cp ${pkg}.zip s3://$BUCKET_ID/builds/$APP_VERSION/${pkg}.zip
                    rm bootstrap ${pkg}.zip
                    cd ..
                  done
                  cd ../../terraform/infra

            - name: Terraform Apply
              # Pass the app_version to switch Terraform to S3 mode
              run: terraform apply -var-file=${{ env.TF_VAR_file }} -var="app_version=${{ github.sha }}" -auto-approve
